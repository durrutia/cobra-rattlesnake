<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 200 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: site.og_image | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="{{ site.twitter_handle }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | truncate: 200 }}">
  <meta name="twitter:image" content="{{ page.image | default: site.og_image | absolute_url }}">
  <meta name="twitter:image:alt" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">🐍</span>
      <span>COBRA<br><i>RATTLESNAKE</i></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation menu" hidden>☰</button>
    <nav id="main-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/products/' | relative_url }}">Sauces</a>
      <a href="{{ '/about/' | relative_url }}">Story</a>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer>
    <div>
      <strong>COBRA RATTLESNAKE</strong><br>
      Fictional sauce. Real attitude.
    </div>
    <div class="footer-bike" aria-hidden="true">🚲 + 🌶️ = ❤️</div>
  </footer>
  <script>
    (function(){
      const toggle = document.querySelector('.nav-toggle');
      const nav = document.getElementById('main-nav');
      if(!toggle || !nav) return;
      toggle.hidden = false;
      toggle.addEventListener('click', function(){
        const isOpen = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen);
        toggle.textContent = isOpen ? '✕' : '☰';
      });
      nav.querySelectorAll('a').forEach(function(link){
        link.addEventListener('click', function(){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.textContent = '☰';
        });
      });
    })();
  </script>
</body>
</html>

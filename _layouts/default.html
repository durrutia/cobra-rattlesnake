<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">🐍</span>
      <span>COBRA<br><i>RATTLESNAKE</i></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation menu" hidden>☰</button>
    <nav id="main-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/products/' | relative_url }}">Sauces</a>
      <a href="{{ '/about/' | relative_url }}">Story</a>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer>
    <div>
      <strong>COBRA RATTLESNAKE</strong><br>
      Fictional sauce. Real attitude.
    </div>
    <div class="footer-bike" aria-hidden="true">🚲 + 🌶️ = ❤️</div>
  </footer>
  <script>
    (function(){
      const toggle = document.querySelector('.nav-toggle');
      const nav = document.getElementById('main-nav');
      if(!toggle || !nav) return;
      toggle.hidden = false;
      toggle.addEventListener('click', function(){
        const isOpen = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen);
        toggle.textContent = isOpen ? '✕' : '☰';
      });
      nav.querySelectorAll('a').forEach(function(link){
        link.addEventListener('click', function(){
          nav.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.textContent = '☰';
        });
      });
    })();
  </script>
</body>
</html>
